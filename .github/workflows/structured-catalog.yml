name: Build structured interview catalog
on:
  push:
    branches: ['expand/ai-interviews-20260920']
    paths:
      - 'tools/extract_questions_v2.py'
      - '.github/workflows/structured-catalog.yml'
permissions:
  contents: write
concurrency:
  group: structured-interview-catalog-expansion
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: expand/ai-interviews-20260920
          fetch-depth: 0
      - name: Test collector and structured parser
        run: |
          python tools/test_catalog.py
          python tools/extract_questions_v2.py --self-test
      - name: Rebuild pinned sources with structured extraction and rights review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/extract_questions_v2.py
          python tools/question_bank.py validate
      - name: Commit generated catalog to expansion branch
        run: |
          test "$(git branch --show-current)" = 'expand/ai-interviews-20260920'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md expansion/
          if ! git diff --cached --quiet; then
            git commit -m 'data: rebuild structured questions and preserve extraction audit'
            git push origin HEAD:expand/ai-interviews-20260920
          fi
      - name: Package catalog
        run: |
          mkdir -p dist
          zip -q -r dist/ai-interview-expanded.zip expansion tools EXPANSION.zh-CN.md README.md LICENSE -x '*/__pycache__/*'
          cat expansion/stats.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-interview-expanded-structured
          path: dist/ai-interview-expanded.zip
          retention-days: 30
