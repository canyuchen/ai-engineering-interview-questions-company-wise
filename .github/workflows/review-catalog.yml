name: Review collected interview snapshot
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'tools/review_catalog.py'
      - '.github/workflows/review-catalog.yml'
permissions:
  contents: write
concurrency:
  group: interview-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'expand/ai-interviews-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Test parser and source pipeline
        run: python tools/test_catalog.py
      - name: Review and validate the existing snapshot
        run: |
          python tools/review_catalog.py
          python tools/review_catalog.py
          python tools/question_bank.py validate
      - name: Commit reviewed data to the expansion branch only
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test "$HEAD_BRANCH" = 'expand/ai-interviews-20260920'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add expansion/
          if ! git diff --cached --quiet; then
            git commit -m 'data: clean 105 duplicate variants and enrich company labels'
            git push origin "HEAD:$HEAD_BRANCH"
          fi
      - name: Package reviewed offline catalog
        run: |
          mkdir -p dist
          zip -q -r dist/ai-interview-expanded.zip expansion tools EXPANSION.zh-CN.md README.md LICENSE -x '*/__pycache__/*'
          cat expansion/stats.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-interview-expanded-reviewed
          path: dist/ai-interview-expanded.zip
          retention-days: 30
