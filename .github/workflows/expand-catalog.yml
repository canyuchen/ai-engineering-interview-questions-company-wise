name: Build sourced interview expansion
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
concurrency:
  group: interview-expansion-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'expand/ai-interviews-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Test parser and collection pipeline
        run: python tools/test_catalog.py
      - name: Collect public sources and render catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/collect_sources.py
      - name: Validate provenance and counts
        run: python tools/question_bank.py validate
      - name: Commit catalog to the expansion branch only
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test "$HEAD_BRANCH" = 'expand/ai-interviews-20260920'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md expansion/
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect licensed question candidates with immutable provenance'
            git push origin "HEAD:$HEAD_BRANCH"
          fi
      - name: Package offline catalog
        run: |
          mkdir -p dist
          zip -q -r dist/ai-interview-expansion.zip expansion tools EXPANSION.zh-CN.md README.md LICENSE -x '*/__pycache__/*'
          cat expansion/stats.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-interview-expansion
          path: dist/ai-interview-expansion.zip
          retention-days: 30
